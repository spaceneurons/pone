</g><g id="Partners" data-section="Partners" aria-label="Партнерам"><text fill="#393939" style="white-space: pre" xml:space="preserve" font-family="Onest" font-size="16" letter-spacing="0.02em"><tspan x="830" y="6626.82">Обед </tspan><tspan x="877.32" y="6626.82">для </tspan><tspan x="911.601" y="6626.82">команды </tspan><tspan x="987.021" y="6626.82">в </tspan><tspan x="1002.12" y="6626.82">разгар </tspan><tspan x="1062.25" y="6626.82">рабочей </tspan><tspan x="1134.89" y="6626.82">недели, </tspan><tspan x="1201.98" y="6626.82">питание </tspan><tspan x="830" y="6645.82">на </tspan><tspan x="854.038" y="6645.82">конференции, </tspan><tspan x="970.729" y="6645.82">перекусы </tspan><tspan x="1052.58" y="6645.82">на </tspan><tspan x="1076.62" y="6645.82">выездном </tspan><tspan x="1160.7" y="6645.82">мероприятии </tspan><tspan x="830" y="6664.82">или </tspan><tspan x="867.744" y="6664.82">угощение </tspan><tspan x="954.416" y="6664.82">для </tspan><tspan x="991.442" y="6664.82">гостей </tspan><tspan x="1053.74" y="6664.82">праздника </tspan><tspan x="1146.15" y="6664.82">— </tspan><tspan x="1167.38" y="6664.82">под </tspan><tspan x="1205.06" y="6664.82">каждую </tspan><tspan x="830" y="6683.82">задачу </tspan><tspan x="896.505" y="6683.82">собираем </tspan><tspan x="987.041" y="6683.82">свой </tspan><tspan x="1036.84" y="6683.82">бокс. </tspan><tspan x="1089.62" y="6683.82">Подберём </tspan><tspan x="1182.91" y="6683.82">меню </tspan><tspan x="1238.09" y="6683.82">под </tspan><tspan x="830" y="6702.82">формат, </tspan><tspan x="905.193" y="6702.82">количество </tspan><tspan x="1008.39" y="6702.82">человек </tspan><tspan x="1084.63" y="6702.82">и </tspan><tspan x="1106.23" y="6702.82">бюджет: </tspan><tspan x="1184.28" y="6702.82">от </tspan><tspan x="1213.63" y="6702.82">лёгких </tspan><tspan x="830" y="6721.82">перекусов </tspan><tspan x="918.778" y="6721.82">до </tspan><tspan x="943.051" y="6721.82">полноценных </tspan><tspan x="1053.14" y="6721.82">обедов.
</tspan><tspan x="830" y="6740.82">
</tspan><tspan x="830" y="6759.82">Канапе, </tspan><tspan x="913.958" y="6759.82">брускетты, </tspan><tspan x="1023.84" y="6759.82">мини-сэндвичи, </tspan><tspan x="1174.18" y="6759.82">тарталетки, </tspan><tspan x="830" y="6778.82">сырные </tspan><tspan x="896.394" y="6778.82">и </tspan><tspan x="912.297" y="6778.82">фруктовые </tspan><tspan x="1005.18" y="6778.82">тарелки, </tspan><tspan x="1079.26" y="6778.82">свежие </tspan><tspan x="1144.72" y="6778.82">овощи </tspan><tspan x="1202.65" y="6778.82">и </tspan><tspan x="1218.56" y="6778.82">соусы </tspan><tspan x="830" y="6797.82">— </tspan><tspan x="850.69" y="6797.82">есть </tspan><tspan x="893.95" y="6797.82">из </tspan><tspan x="920.57" y="6797.82">чего </tspan><tspan x="964.345" y="6797.82">собрать </tspan><tspan x="1036.75" y="6797.82">и </tspan><tspan x="1054.83" y="6797.82">лёгкий </tspan><tspan x="1117.73" y="6797.82">фуршет, </tspan><tspan x="1190.37" y="6797.82">и </tspan><tspan x="1208.46" y="6797.82">сытный </tspan><tspan x="830" y="6816.82">перекус. </tspan><tspan x="907.257" y="6816.82">Гости </tspan><tspan x="960.164" y="6816.82">не </tspan><tspan x="987.188" y="6816.82">останутся </tspan><tspan x="1075.72" y="6816.82">равнодушными, </tspan><tspan x="1208.86" y="6816.82">а </tspan><tspan x="1226.17" y="6816.82">вы </tspan><tspan x="1254.54" y="6816.82">— </tspan><tspan x="830" y="6835.82">без </tspan><tspan x="862.202" y="6835.82">комплиментов.
</tspan><tspan x="830" y="6854.82">
</tspan><tspan x="830" y="6873.82">С </tspan><tspan x="848.682" y="6873.82">юрлицами </tspan><tspan x="937.744" y="6873.82">работаем </tspan><tspan x="1021.18" y="6873.82">просто </tspan><tspan x="1084.15" y="6873.82">и </tspan><tspan x="1101" y="6873.82">прозрачно: </tspan><tspan x="1197.27" y="6873.82">договор, </tspan><tspan x="830" y="6892.82">счёт, </tspan><tspan x="890.197" y="6892.82">полный </tspan><tspan x="970.76" y="6892.82">пакет </tspan><tspan x="1036.75" y="6892.82">закрывающих </tspan><tspan x="1168.67" y="6892.82">документов. </tspan><tspan x="830" y="6911.82">Постоянным </tspan><tspan x="949.201" y="6911.82">клиентам </tspan><tspan x="1044.53" y="6911.82">— </tspan><tspan x="1077.21" y="6911.82">отсрочка </tspan><tspan x="1170.38" y="6911.82">платежа </tspan><tspan x="1257.15" y="6911.82">и </tspan><tspan x="830" y="6930.82">персональный </tspan><tspan x="966.091" y="6930.82">менеджер, </tspan><tspan x="1072.49" y="6930.82">который </tspan><tspan x="1160.45" y="6930.82">знает </tspan><tspan x="1225.97" y="6930.82">ваши </tspan><tspan x="830" y="6949.82">предпочтения. </tspan><tspan x="952.921" y="6949.82">Вам </tspan><tspan x="991.5" y="6949.82">остаётся </tspan><tspan x="1069.81" y="6949.82">заниматься </tspan><tspan x="1168.98" y="6949.82">событием </tspan><tspan x="1254.54" y="6949.82">— </tspan><tspan x="830" y="6968.82">о </tspan><tspan x="844.468" y="6968.82">еде </tspan><tspan x="877.701" y="6968.82">позаботимся </tspan><tspan x="985.885" y="6968.82">мы.</tspan></text>
